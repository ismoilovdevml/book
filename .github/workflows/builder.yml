name: DevOps Journey CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    # corepack pins pnpm to the packageManager field, so CI resolves the same
    # versions as the lockfile instead of whatever pnpm major is latest
    - name: Install pnpm
      run: corepack enable && corepack prepare pnpm@8.15.4 --activate

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build app
      run: pnpm next build